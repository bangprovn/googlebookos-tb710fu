[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = { version = "0.10", features = ["asm"] }
crc32fast = "1.5"
flate2 = "1.1"
tempfile = "3.27"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
goblin = "0.10"
fs2 = "0.4"
libc = "0.2"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gb-core = { path = "crates/gb-core" }
gb-partition = { path = "crates/gb-partition" }
gb-firmware = { path = "crates/gb-firmware" }
gb-config = { path = "crates/gb-config" }
gb-compat = { path = "crates/gb-compat" }
gb-build = { path = "crates/gb-build" }
gb-tools = { path = "crates/gb-tools" }
gb-framework = { path = "crates/gb-framework" }
gb-apex = { path = "crates/gb-apex" }
gb-vintf = { path = "crates/gb-vintf" }
gb-selinux = { path = "crates/gb-selinux" }
prost = "0.14"
tar = "0.4"
gb-image = { path = "crates/gb-image" }
gb-boot = { path = "crates/gb-boot" }
gb-avb = { path = "crates/gb-avb" }
